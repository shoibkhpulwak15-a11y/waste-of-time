<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WASTE OF TIME — Game Portal</title>
<style>
:root{
  --bg:#080a12;--panel:#101522;--panel2:#151b2b;--text:#f7f8ff;--muted:#8d96ad;
  --accent:#7c5cff;--accent2:#20d9ff;--line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
body:before{content:"";position:fixed;inset:-30%;z-index:-2;background:
 radial-gradient(circle at 15% 10%,rgba(124,92,255,.22),transparent 30%),
 radial-gradient(circle at 90% 20%,rgba(32,217,255,.14),transparent 28%),
 radial-gradient(circle at 55% 100%,rgba(255,55,160,.10),transparent 35%);filter:blur(30px)}
body:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
header{position:sticky;top:0;z-index:20;height:72px;border-bottom:1px solid var(--line);background:rgba(8,10,18,.82);backdrop-filter:blur(18px);display:flex;align-items:center;gap:24px;padding:0 clamp(18px,4vw,60px)}
.logo{font-weight:1000;letter-spacing:-.06em;font-size:26px;white-space:nowrap;color:#ff1a1a}
.logo span{color:#ff1a1a}
.nav{display:flex;gap:6px}
.nav button{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:800}
.nav button.active,.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.search{margin-left:auto;position:relative;width:min(330px,35vw)}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:13px;background:#0d111c;color:#fff;outline:0;padding:0 15px 0 40px}
.search input:focus{border-color:rgba(124,92,255,.7);box-shadow:0 0 0 3px rgba(124,92,255,.12)}
.search svg{position:absolute;left:13px;top:12px;opacity:.55}
main{max-width:1400px;margin:auto;padding:30px clamp(18px,4vw,60px) 70px}
.hero{min-height:390px;border:1px solid var(--line);border-radius:28px;overflow:hidden;position:relative;display:flex;align-items:flex-end;background:
 linear-gradient(90deg,rgba(8,10,18,.98) 0%,rgba(8,10,18,.78) 43%,rgba(8,10,18,.18) 100%),
 radial-gradient(circle at 72% 38%,rgba(32,217,255,.28),transparent 18%),
 linear-gradient(135deg,#17112e,#0e1d31 60%,#111827)}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 45%,rgba(124,92,255,.34),transparent 30%);pointer-events:none}
.heroArt{position:absolute;right:7%;top:7%;width:43%;height:86%;display:flex;align-items:center;justify-content:center;opacity:.92}
.heroIcon{font-size:clamp(110px,16vw,220px);filter:drop-shadow(0 0 35px rgba(32,217,255,.35));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}
.heroContent{position:relative;z-index:2;padding:42px;max-width:670px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--accent2);font-weight:1000;margin-bottom:12px}
.hero h1{font-size:clamp(42px,6vw,76px);line-height:.92;letter-spacing:-.06em;margin:0 0 14px}
.hero p{color:#b8bfd0;font-size:16px;line-height:1.6;max-width:560px}
.heroBtns{display:flex;gap:10px;margin-top:24px}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:900}
.btn.primary{background:#fff;color:#080a12}
.btn.secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.section{margin-top:38px}
.sectionHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}
.section h2{font-size:24px;margin:0;letter-spacing:-.03em}
.sectionHead small{color:var(--muted)}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:3px}
.filter{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#adb5c7;border-radius:999px;padding:8px 13px;font-weight:800;white-space:nowrap}
.filter.active,.filter:hover{background:#fff;color:#090b12}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:linear-gradient(180deg,#131928,#0e131f);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s transform,.2s border-color,.2s box-shadow;position:relative}
.card:hover{transform:translateY(-5px);border-color:rgba(124,92,255,.55);box-shadow:0 18px 45px rgba(0,0,0,.3)}
.thumb{height:175px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.15),transparent 28%),linear-gradient(135deg,var(--c1),var(--c2))}
.thumb:after{content:"";position:absolute;inset:0;background-image:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.08) 21%,transparent 22%,transparent 60%,rgba(255,255,255,.05) 61%,transparent 62%);background-size:85px 85px;transform:skewY(-10deg)}
.thumbIcon{position:relative;z-index:2;font-size:72px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.3))}
.badge{position:absolute;z-index:3;top:11px;left:11px;padding:6px 8px;border-radius:7px;background:rgba(0,0,0,.45);font-size:10px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em}
.star{position:absolute;z-index:4;top:9px;right:9px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.38);color:#fff;font-size:18px}
.star.on{color:#ffd34d}
.cardBody{padding:14px}
.cardTitle{font-size:17px;font-weight:950;margin-bottom:5px}
.cardDesc{font-size:12px;color:var(--muted);min-height:36px;line-height:1.45}
.cardMeta{display:flex;justify-content:space-between;align-items:center;margin-top:13px}
.playMini{border:0;border-radius:9px;background:#252d40;color:#fff;padding:8px 11px;font-weight:900}
.playMini:hover{background:#fff;color:#0b0d14}
.empty{padding:45px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
footer{border-top:1px solid var(--line);padding:28px 18px;text-align:center;color:#626b80;font-size:12px}
#player{position:fixed;inset:0;z-index:50;background:#03050a;display:none;flex-direction:column}
#player.show{display:flex}
.playerBar{height:60px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#0b0e17;border-bottom:1px solid var(--line)}
.playerTitle{font-weight:950;flex:1}
.playerBtn{border:1px solid var(--line);background:#151a27;color:#fff;border-radius:9px;padding:9px 12px;font-weight:900}
.playerBtn:hover{background:#222a3c}
#gameFrame{width:100%;height:calc(100% - 60px);border:0;background:#000}
.toast{position:fixed;z-index:100;left:50%;bottom:24px;transform:translate(-50%,20px);background:#fff;color:#090b12;padding:11px 16px;border-radius:10px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}.heroArt{right:2%;opacity:.55}}
@media(max-width:760px){header{height:auto;min-height:68px;flex-wrap:wrap;padding:12px 16px;gap:8px}.nav{order:3;width:100%;overflow:auto}.search{width:190px}.hero{min-height:440px}.heroContent{padding:28px}.heroArt{top:15%;right:0;width:100%;height:45%;opacity:.45}.heroContent{margin-top:180px}.grid{grid-template-columns:repeat(2,1fr)}.thumb{height:150px}}
@media(max-width:480px){.logo{font-size:23px}.search{margin-left:auto;width:150px}.hero h1{font-size:42px}.heroBtns{flex-wrap:wrap}.grid{grid-template-columns:1fr}.thumb{height:180px}}
</style>
</head>
<body>
<header>
  <div class="logo">WASTE <span>OF TIME</span></div>
  <nav class="nav">
    <button class="active" data-cat="All">Home</button>
    <button data-cat="Arcade">Arcade</button>
    <button data-cat="Action">Action</button>
    <button data-cat="Racing">Racing</button>
    <button data-cat="Puzzle">Puzzle</button>
    <button data-cat="Board">Board</button>
    <button data-cat="Cards">Cards</button>
    <button data-cat="Music">Music</button>
    <button data-cat="Favorites">Favorites</button>
  </nav>
  <div class="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="search" placeholder="Search games...">
  </div>
</header>

<main>
  <section class="hero">
    <div class="heroArt"><div class="heroIcon">🚀</div></div>
    <div class="heroContent">
      <div class="kicker">Featured game</div>
      <h1>GALAXY<br>DEFENDER</h1>
      <p>Jump straight into the action. Defend the galaxy, survive enemy waves, and chase a new high score.</p>
      <div class="heroBtns">
        <button class="btn primary" onclick="openGame('galaxy')">▶ PLAY NOW</button>
        <button class="btn secondary" onclick="document.getElementById('games').scrollIntoView({behavior:'smooth'})">BROWSE GAMES</button>
      </div>
    </div>
  </section>

  <section class="section" id="games">
    <div class="sectionHead"><div><h2>All Games</h2><small id="count"></small></div></div>
    <div class="filters">
      <button class="filter active" data-filter="All">All</button>
      <button class="filter" data-filter="Arcade">Arcade</button>
      <button class="filter" data-filter="Action">Action</button>
      <button class="filter" data-filter="Racing">Racing</button>
      <button class="filter" data-filter="Puzzle">Puzzle</button>
      <button class="filter" data-filter="Board">Board</button>
      <button class="filter" data-filter="Cards">Cards</button>
      <button class="filter" data-filter="Music">Music</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="section">
    <div class="sectionHead"><h2>Quick picks</h2><small>Your games, one click away</small></div>
    <div class="grid" id="quick"></div>
  </section>
</main>
<footer>WASTE OF TIME · Your personal game collection</footer>

<div id="player">
  <div class="playerBar">
    <button class="playerBtn" onclick="closeGame()">← HOME</button>
    <div class="playerTitle" id="playerTitle">Game</div>
    <button class="playerBtn" onclick="reloadGame()">↻ RESTART</button>
    <button class="playerBtn" onclick="fullscreenGame()">⛶ FULLSCREEN</button>
  </div>
  <iframe id="gameFrame" allow="autoplay; fullscreen; gamepad" title="Game"></iframe>
</div>
<div class="toast" id="toast"></div>

  {id:"mystery",name:"L",cat:"Puzzle",icon:"🕵️",desc:"Crack 40 logic cases by combining clues and deductions.",c1:"#174a35",c2:"#7a4d13",tag:"New"},
  
  {id:"galaxy",name:"SLIMING OUT THE OPPS",cat:"Arcade",icon:"🚀",desc:"Blast through waves of enemies and upgrade your weapon.",c1:"#182c68",c2:"#5b2b91",tag:"Featured"},
  {id:"tidekeeper",name:"LIGHT",cat:"Action",icon:"🌊",desc:"Defend the night waters against an ever-growing threat.",c1:"#073e5b",c2:"#142b68",tag:"New"},
  {id:"skiddodge",name:"DRUNK DRIVING",cat:"Racing",icon:"🏎️",desc:"Dodge traffic, survive the road, and push your score higher.",c1:"#5a1820",c2:"#b34d16",tag:"Racing"},
  {id:"skidloop",name:"ADHD",cat:"Arcade",icon:"💥",desc:"Drift, enclose enemies, and detonate huge loops.",c1:"#48134e",c2:"#1d4e63",tag:"Arcade"},

  {id:"gravity",name:"OPPOSITE DAY",cat:"Action",icon:"🌀",desc:"Flip gravity, dodge hazards, collect treasures, and survive.",c1:"#24164f",c2:"#116b82",tag:"New"},

  {id:"instruments",name:"WE NOT MAKING IT OUT THE HOOD",cat:"Music",icon:"🎹",desc:"Play piano, synth, bass, strings, drums, and more.",c1:"#4a176d",c2:"#c23b9b",tag:"Music"},
  {id:"potato",name:"DONT PRESS THIS",cat:"Arcade",icon:"",desc:"You probably should not press this.",c1:"#555",c2:"#777",tag:"New"}
];
let activeFilter="All", query="", favorites=JSON.parse(localStorage.getItem("WASTE OF TIME_favorites")||"[]"), currentId=null;

function render(){
  const list=games.filter(g=>{
    const cat=activeFilter==="All"||activeFilter==="Favorites" ? true : g.cat===activeFilter;
    const fav=activeFilter!=="Favorites" || favorites.includes(g.id);
    const q=!query || (g.name+" "+g.cat+" "+g.desc).toLowerCase().includes(query.toLowerCase());
    return cat&&fav&&q;
  });
  document.getElementById("count").textContent=list.length+" game"+(list.length===1?"":"s");
  document.getElementById("grid").innerHTML=list.length?list.map(card).join(""):'<div class="empty">No games found. Try another search.</div>';
  document.getElementById("quick").innerHTML=games.map(card).join("");
}
function card(g){
  const fav=favorites.includes(g.id);
  return `<article class="card">
    <div class="thumb" style="--c1:${g.c1};--c2:${g.c2}">
      <span class="badge">${g.tag}</span>
      <button class="star ${fav?"on":""}" onclick="event.stopPropagation();toggleFav('${g.id}')" aria-label="favorite">${fav?"★":"☆"}</button>
      <div class="thumbIcon">${g.id==="potato"?`<div style="width:150px;height:100px;border-radius:12px;background:#777"></div>`:g.icon}</div>
    </div>
    <div class="cardBody">
      <div class="cardTitle">${g.name}</div>
      <div class="cardDesc">${g.desc}</div>
      <div class="cardMeta"><small>${g.cat}</small><button class="playMini" onclick="openGame('${g.id}')">PLAY</button></div>
    </div>
  </article>`;
}
function toggleFav(id){
  favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];
  localStorage.setItem("WASTE OF TIME_favorites",JSON.stringify(favorites)); render(); toast(favorites.includes(id)?"Added to favorites":"Removed from favorites");
}
function openGame(id){
  const g=games.find(x=>x.id===id); if(!g)return;
  currentId=id;
  document.getElementById("playerTitle").textContent=g.name;
  const bytes=atob(GAME_DATA[id]); const arr=new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);
  document.getElementById("gameFrame").srcdoc=new TextDecoder().decode(arr);
  document.getElementById("player").classList.add("show");
  document.body.style.overflow="hidden";
}
function closeGame(){
  document.getElementById("player").classList.remove("show");
  document.getElementById("gameFrame").srcdoc="";
  currentId=null; document.body.style.overflow="";
}
function reloadGame(){if(currentId)openGame(currentId)}
function fullscreenGame(){
  const f=document.getElementById("gameFrame");
  if(f.requestFullscreen)f.requestFullscreen(); else toast("Fullscreen is not available here");
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1300)}
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
  activeFilter=b.dataset.cat;
  document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("active",x===b));
  document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x.dataset.filter===activeFilter));
  render();
});
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{
  activeFilter=b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));
  document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("active",x.dataset.cat===activeFilter));
  render();
});
document.getElementById("search").oninput=e=>{query=e.target.value;render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("player").classList.contains("show"))closeGame()});
render();
</script>
